name: Build & deploy to Cloudflare

# Runs on every push to main — including posts published via Pages CMS —
# so the live site rebuilds and updates automatically (~1-2 min).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid overlapping deploys if several saves land close together.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to see which posts changed

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # The blog is prerendered HERE, at build time, not served from the
          # Worker — so a Cloudflare *runtime* secret never reaches it. Without
          # this line every server-rendered page carries the AdSense script and
          # all 17 blog posts carry none: a half-installed implementation that
          # earns nothing on those pages and reads as sloppy to a reviewer.
          #
          # Deliberately in the clear rather than a repository secret. A
          # publisher ID is public by definition — it is already served to the
          # whole internet at /ads.txt, which exists precisely so buyers can
          # read it. Hiding it in a secret would imply it were sensitive and
          # make this failure harder to diagnose next time.
          PUBLIC_ADSENSE_CLIENT: ca-pub-5462566343196770

      # --keep-vars is load-bearing. The Astro adapter writes `"vars": {}` into
      # the generated config, and without this flag wrangler treats that as the
      # complete list and removes every variable and secret set outside the
      # config. The Worker then cannot reach Supabase, the app falls back to its
      # bundled seed, and for several minutes every corridor page serves a
      # loading screen while sitemap-corridors.xml reports one URL instead of
      # ~126 — with the deploy still reporting success. Observed on 14 Sep 2026,
      # and reproduced on the very next deploy.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Post-deploy smoke test.
      #
      # The corridor pages are server-rendered from Supabase, and when the
      # Worker cannot reach Supabase the app quietly falls back to the bundled
      # seed — which contains exactly one route. Every other page then serves
      # the loading screen instead of content, the corridors sitemap collapses
      # from ~126 URLs to 1, and nothing anywhere goes red. That is precisely
      # what happened on 14 September 2026, and it was found by accident while
      # checking something else.
      #
      # The adapter writes `"vars": {}` into the generated wrangler config, so a
      # deploy REPLACES the Worker's plain-text variables with nothing. Anything
      # set as a Variable rather than an encrypted Secret is wiped on the next
      # push. This step makes that failure loud.
      #
      # india-to-japan is deliberately NOT used as a probe: it is the seeded
      # route, so it renders even when the database is unreachable.
      # Retries matter here. A Worker can serve a request or two from the new
      # version before its secrets are fully attached, and during that window
      # the app falls back to the bundled seed exactly as it would if the
      # database were really unreachable. That happened on 14 Sep 2026 and
      # cleared on its own within minutes. A single immediate probe would call
      # that an outage and turn a good deploy red, so this only fails after the
      # problem has persisted for a couple of minutes — long enough to tell a
      # propagation blip from something genuinely broken.
      - name: Smoke test — are corridor pages actually rendering?
        run: |
          probe() {
            body=$(curl -s --max-time 45 "https://infoonvisa.com/$1")
            echo "$body" | grep -q 'Finding your visa requirements' && return 1
            echo "$body" | grep -q 'vtable' || return 1
            return 0
          }

          fail=0
          for slug in india-to-germany united-states-to-india india-to-thailand; do
            ok=0
            for attempt in 1 2 3 4 5; do
              sleep 20
              if probe "$slug"; then ok=1; echo "ok: $slug (attempt $attempt)"; break; fi
              echo "  $slug not ready yet (attempt $attempt/5)"
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::https://infoonvisa.com/$slug still serving the loading screen after 5 attempts — the Worker cannot read Supabase."
              fail=1
            fi
          done

          # The corridors sitemap is built straight from the database, so its
          # size is the clearest single signal that reads are working.
          count=$(curl -s --max-time 45 https://infoonvisa.com/sitemap-corridors.xml | grep -c '<loc>' || true)
          echo "corridors sitemap URLs: $count"
          if [ "$count" -lt 50 ]; then
            echo "::error::Only $count URL(s) in sitemap-corridors.xml — expected ~126. Database reads are failing."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "This persisted for over two minutes, so it is not a deploy blip."
            echo "Check, in this order:"
            echo "  1. Is Supabase up?  status.supabase.com"
            echo "  2. Cloudflare → Workers → infoonvisa → Settings → Variables and"
            echo "     Secrets: PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY and"
            echo "     SUPABASE_SERVICE_ROLE_KEY must all be present as SECRETS."
            echo "     (Plain Variables get erased by a deploy; Secrets do not.)"
            echo "  3. Has the service-role key been rotated in Supabase without"
            echo "     updating the Worker?"
            echo ""
            echo "Note: india-to-japan is the seeded route and renders even when the"
            echo "database is unreachable — never use it to judge whether this is fixed."
            exit 1
          fi

      # Tell Bing about posts that changed in this push, so a post published
      # through Pages CMS is submitted without anyone remembering to do it.
      # Only changed posts are sent — resubmitting unchanged URLs on every push
      # is what IndexNow asks publishers not to do.
      - name: Submit changed posts to IndexNow
        if: github.event_name == 'push'
        continue-on-error: true # indexing must never fail a deploy
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d HEAD^ HEAD -- 'src/content/blog/*.md' || true)
          URLS=""
          for f in $CHANGED; do
            slug=$(basename "$f" .md)
            URLS="$URLS https://infoonvisa.com/blog/$slug"
          done
          if [ -n "$URLS" ]; then
            echo "Changed posts:$URLS"
            node scripts/indexnow.mjs $URLS
          else
            echo "No blog posts changed in this push — nothing to submit."
          fi
