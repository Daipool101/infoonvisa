name: Build & deploy to Cloudflare

# Runs on every push to main — including posts published via Pages CMS —
# so the live site rebuilds and updates automatically (~1-2 min).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid overlapping deploys if several saves land close together.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the previous commit to see which posts changed

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tell Bing about posts that changed in this push, so a post published
      # through Pages CMS is submitted without anyone remembering to do it.
      # Only changed posts are sent — resubmitting unchanged URLs on every push
      # is what IndexNow asks publishers not to do.
      - name: Submit changed posts to IndexNow
        if: github.event_name == 'push'
        continue-on-error: true # indexing must never fail a deploy
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d HEAD^ HEAD -- 'src/content/blog/*.md' || true)
          URLS=""
          for f in $CHANGED; do
            slug=$(basename "$f" .md)
            URLS="$URLS https://infoonvisa.com/blog/$slug"
          done
          if [ -n "$URLS" ]; then
            echo "Changed posts:$URLS"
            node scripts/indexnow.mjs $URLS
          else
            echo "No blog posts changed in this push — nothing to submit."
          fi
