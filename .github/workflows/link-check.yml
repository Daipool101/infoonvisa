name: Weekly source-link check

# Government sites move and get decommissioned, which silently breaks the
# "official source" links on live corridor pages, and entry rules change under
# verdicts we have already published. This checks both every week.
#
# Design note, learned the hard way. The checks used to signal "found something"
# by exiting 1, with `continue-on-error: true` so the job stayed green. That made
# three different situations look identical from the outside — healthy site,
# broken site, crashed script — and when the verdict script failed on 14 Sep 2026
# the notify step was skipped and nobody was told anything. Now:
#
#   · the scripts exit 0 unless they genuinely failed, and report what they found
#     as step OUTPUTS
#   · nothing is masked with continue-on-error, so a crash fails the run and
#     GitHub emails you about the failed workflow
#   · every run writes a summary you can open in the Actions tab
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC (~09:30 IST)
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a TEST alert (proves email delivery; nothing is really broken)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # No continue-on-error: if this cannot run, the workflow must go red.
      - name: Check source links
        id: check
        run: node scripts/check-links.mjs
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIMULATE_BROKEN: ${{ inputs.test_alert }}

      - name: Check for verdicts needing review
        id: verdicts
        run: node scripts/verdict-review.mjs
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---- Broken source links -------------------------------------------
      - name: Open an issue when links are broken
        if: steps.check.outputs.broken != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const count = '${{ steps.check.outputs.broken }}';
            // Assign + @mention the owner: watching a repo does not reliably
            // email you about issues a bot opens, but being assigned or
            // mentioned does, under GitHub's default notification settings.
            const body = `@${owner}\n\n${process.env.REPORT}`;
            const title = `${count} broken source link${count === '1' ? '' : 's'} on live pages`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'link-check',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open[0].number,
                body: `Re-checked on ${new Date().toISOString().slice(0, 10)}:\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ['link-check'], assignees: [owner],
              });
            }
        env:
          REPORT: ${{ steps.check.outputs.body }}

      - name: Close the link issue when everything is healthy
        if: steps.check.outputs.broken == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'link-check',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'All source links are healthy again — closing.',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }

      # ---- Verdicts due a human check -------------------------------------
      # A script cannot judge whether a verdict is right — that needs reading an
      # official source — so this only says which pages deserve attention next.
      # One rolling issue, and a COMMENT (which notifies) only when the set of
      # pages actually changes. Editing an issue body notifies nobody, which is
      # how three weeks of changes went unannounced.
      - name: Keep one rolling verdict-review issue
        if: steps.verdicts.outputs.overdue != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sig = '${{ steps.verdicts.outputs.sig }}';
            const body = `@${owner}\n\n${process.env.REPORT}\n\n<!-- verdict-sig:${sig} -->`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'verdict-review',
            });

            if (!open.length) {
              await github.rest.issues.create({
                owner, repo,
                title: 'Verdicts due a check against official sources',
                body, labels: ['verdict-review'], assignees: [owner],
              });
              core.info('Opened a new verdict-review issue.');
              return;
            }

            const issue = open[0];
            const prevSig = (issue.body || '').match(/<!-- verdict-sig:([a-z0-9]*) -->/)?.[1] ?? '';

            // Refresh the body so the issue is never stale when opened...
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, body,
            });

            // ...and comment only when the actual set of pages has moved.
            if (prevSig !== sig) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `@${owner} the list of verdicts needing a check has **changed** since the last run.\n\n${process.env.REPORT}`,
              });
              core.info(`Commented: signature ${prevSig || '(none)'} -> ${sig}`);
            } else {
              core.info('Verdict list unchanged — issue refreshed silently, no comment.');
            }
        env:
          REPORT: ${{ steps.verdicts.outputs.body }}

      - name: Close the verdict-review issue when nothing is overdue
        if: steps.verdicts.outputs.overdue == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'verdict-review',
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `@${owner} every live page now has a verdict confirmed against an official source. Closing — this reopens automatically if any page falls out of date.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }

      # ---- Proof of life ---------------------------------------------------
      # A healthy week is deliberately silent, which makes silence ambiguous:
      # "nothing is broken" and "the automation stopped" look identical from an
      # inbox. One short report a month, on the first run after the 1st, so a
      # missing report is itself the signal.
      # No `if:` — the script itself decides whether today is the monthly run,
      # so there is one place holding that rule rather than two that can drift.
      - name: Monthly "still watching" report
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            if (now.getUTCDate() > 7 && context.eventName === 'schedule') {
              core.info(`Day ${now.getUTCDate()} — not the monthly report run.`);
              return;
            }
            const checked = '${{ steps.check.outputs.checked }}' || 'all';
            const broken = '${{ steps.check.outputs.broken }}';
            const overdue = '${{ steps.verdicts.outputs.overdue }}';
            const month = now.toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
            const body = [
              `@${owner} **Monthly health report — ${month}**`,
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| Official source links | ${broken === '0' ? `✅ ${checked} checked, all healthy` : `⚠️ ${broken} broken — see the open link-check issue`} |`,
              `| Verdicts confirmed against an official source | ${overdue === '0' ? '✅ every live page is current' : `⚠️ ${overdue} page(s) due a check`} |`,
              '',
              'This arrives once a month whether or not anything is wrong, so silence is never ambiguous.',
              'If a month passes with no report, the automation itself has stopped — check the Actions tab.',
              '',
              'Anything genuinely broken raises its own issue immediately; you do not wait for this.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'health-report',
            });
            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'Monthly health report — source links & verdicts',
                body, labels: ['health-report'], assignees: [owner],
              });
            }

      # ---- Always leave a trace -------------------------------------------
      # So the next person debugging "why did I get no email?" can read what the
      # run actually found, instead of inferring it from which steps skipped.
      - name: Write run summary
        if: always()
        run: |
          {
            echo "### Weekly check — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| links checked | \`${{ steps.check.outputs.checked }}\` |"
            echo "| links broken | \`${{ steps.check.outputs.broken }}\` |"
            echo "| verdicts overdue | \`${{ steps.verdicts.outputs.overdue }}\` |"
            echo "| verdict signature | \`${{ steps.verdicts.outputs.sig }}\` |"
            echo "| link step outcome | \`${{ steps.check.outcome }}\` |"
            echo "| verdict step outcome | \`${{ steps.verdicts.outcome }}\` |"
            echo ""
            echo "An empty value above means the script did not get far enough to report it."
          } >> "$GITHUB_STEP_SUMMARY"
